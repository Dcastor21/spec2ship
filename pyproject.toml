[project]
name = "spec2ship"
version = "0.1.0"
description = "A small software factory: a spec goes in, a reviewed pull request comes out."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
spec2ship = "factory.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "factory"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "RUF", # ruff-specific
    "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]         # assert is how pytest works
"target/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not docker and not live"]
markers = [
    "docker: needs a running Docker daemon (run with -m docker)",
    "live: calls a real model API and costs money (run with -m live)",
]

[tool.coverage.run]
source = ["factory"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
